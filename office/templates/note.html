<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
@font-face { font-family: "Galmuri11"; src: url("__FONT_REGULAR__") format("woff2"); font-weight: 400; }
@font-face { font-family: "Galmuri11"; src: url("__FONT_BOLD__") format("woff2"); font-weight: 700; }
@page {
  size: A4;
  margin: 14mm 14mm 18mm;
  @bottom-left { content: "ritual의 공부 사무실 · __DATE__"; font-family: "Galmuri11"; font-size: 7.5pt; color: #7a7290; }
  @bottom-right { content: counter(page) " / " counter(pages); font-family: "Galmuri11"; font-size: 7.5pt; color: #7a7290; }
}
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; font-family: "Malgun Gothic", sans-serif; font-size: 10.5pt; line-height: 1.65; color: #1d1b26; }
.pixel, h1, h2, .box-title, th { font-family: "Galmuri11", "Malgun Gothic", sans-serif; }
.brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3mm; }
.brand img { height: 22px; image-rendering: pixelated; }
.brand span { font-size: 8pt; color: #7a7290; letter-spacing: 0.08em; }
.bar { display: flex; height: 8px; margin-bottom: 6mm; }
.bar span { flex: 1; }
h1 { font-weight: 700; font-size: 22pt; line-height: 1.3; margin: 0 0 1mm; }
.subtitle { margin: 0 0 7mm; color: #5b5470; font-family: "Galmuri11", "Malgun Gothic", sans-serif; }
section.part { margin: 0 0 6mm; padding-left: 4mm; border-left: 4px solid var(--c); }
section.part h2 { display: flex; align-items: center; gap: 3mm; font-weight: 700; font-size: 13pt; margin: 0 0 2mm; break-after: avoid; }
section.part h2::before { content: ""; width: 8px; height: 8px; background: var(--c); flex: none; }
ul { margin: 0 0 2mm; padding-left: 5mm; }
li { margin: 0.6mm 0; }
.highlight { margin: 3mm 6px 1mm 0; padding: 2mm 3mm; border: 2px solid #1d1b26; box-shadow: 4px 4px 0 var(--c); background: #fff; font-weight: 700; break-inside: avoid; }
.highlight b { font-family: "Galmuri11", sans-serif; color: var(--c); margin-right: 2mm; }
.box-title { font-weight: 700; font-size: 12pt; margin: 0 0 2mm; }
table.terms { width: 100%; border-collapse: collapse; margin: 0 0 7mm; }
table.terms th, table.terms td { border: 2px solid #1d1b26; padding: 1.5mm 2.5mm; text-align: left; vertical-align: top; }
table.terms th { width: 28%; background: #f3eefe; font-weight: 700; }
table.terms tr { break-inside: avoid; }
.summary { margin: 0 6px 6mm 0; padding: 3mm 4mm; border: 2px solid #1d1b26; box-shadow: 4px 4px 0 #9337FD; background: #fbf5ff; break-inside: avoid; }
.sources { font-size: 8pt; color: #7a7290; word-break: break-all; }
section.original { break-before: page; }
section.original h2 { font-size: 15pt; margin: 0 0 4mm; }
.original-text { white-space: pre-wrap; font-size: 10pt; line-height: 1.8; }
</style>
</head>
<body>
<div class="brand">__LOGO__<span class="pixel">STUDY NOTE</span></div>
__BAR__
<h1>__TITLE__</h1>
<p class="subtitle">__SUBTITLE__</p>
__SECTIONS__
__TERMS__
__SUMMARY__
__SOURCES__
__ORIGINAL__
</body>
</html>
