<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · ritual 분석 보고서</title>
<link rel="stylesheet" href="__GALMURI_CSS__">
<style>
:root { --c1:#9337FD; --c2:#E036F0; --c3:#FC34CA; --c4:#FD389C; --c5:#FD633E; --c6:#FC7135;
        --bg:#14111f; --panel:#201a33; --line:#3b2f5c; --ink:#f3eefe; --muted:#a99cc9; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Galmuri11", "Malgun Gothic", sans-serif; padding: 24px 16px 48px;
       background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 24px 24px; line-height: 1.6; }
main { max-width: 860px; margin: 0 auto; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.brand { color: var(--c3); }
button { font: inherit; color: var(--ink); background: var(--c1); border: 4px solid #000; box-shadow: 4px 4px 0 #000; padding: 6px 12px; cursor: pointer; }
button:active { transform: translate(4px, 4px); box-shadow: none; }
button:focus-visible { outline: 4px solid var(--c3); outline-offset: 2px; }
h1 { font-size: 24px; margin: 8px 0 12px; text-shadow: 3px 3px 0 #000; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; font-size: 13px; }
.tags span { padding: 3px 10px; border: 3px solid #000; background: var(--panel); }
.one { font-size: 19px; padding: 16px 18px; background: var(--c1); color: #fff; border: 4px solid #000; box-shadow: 6px 6px 0 #000;
       text-shadow: 2px 2px 0 #000; margin-bottom: 20px; overflow-wrap: anywhere; }
section { background: var(--panel); border: 4px solid #000; box-shadow: 6px 6px 0 #000; padding: 14px 18px; margin-bottom: 18px;
          border-left: 10px solid var(--c); }
h2 { font-size: 17px; margin: 0 0 8px; color: var(--c); }
ul { margin: 0; padding-left: 20px; }
li { margin: 4px 0; overflow-wrap: anywhere; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-top: 2px solid var(--line); overflow-wrap: anywhere; }
th { width: 30%; color: var(--c2); }
footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 12px; }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; color: #000; padding: 0; }
  header button, footer { display: none; }
  section, .one { box-shadow: none; break-inside: avoid; }
  section { background: #fff; }
  .tags span { background: #fff; }
}
</style>
</head>
<body>
<main>
  <header><span class="brand">ritual 분석 보고서</span><button id="print" type="button">인쇄 / PDF로 저장</button></header>
  <h1>__TITLE__</h1>
  <div class="tags" id="tags"></div>
  <p class="one" id="one"></p>
  <div id="sections"></div>
  <footer>ritual의 공부 사무실 · 분석가가 썼어</footer>
</main>
<script id="report-data" type="application/json">__REPORT_JSON__</script>
<script>
const r = JSON.parse(document.getElementById("report-data").textContent);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const tags = document.getElementById("tags");
[r.kind, r.subject, "난이도 " + "★".repeat(r.level) + "☆".repeat(5 - r.level), "예상 공부 " + r.minutes + "분"]
  .forEach((t) => tags.append(el("span", t)));
document.getElementById("one").textContent = r.one_line || r.summary[0] || "";
const COLORS = ["#9337FD", "#E036F0", "#FC34CA", "#FD389C", "#FD633E", "#FC7135"];
const box = document.getElementById("sections");
function section(title, body, i) {
  const s = el("section");
  s.style.setProperty("--c", COLORS[i % COLORS.length]);
  s.append(el("h2", title), body);
  box.append(s);
}
const list = (items) => { const ul = el("ul"); items.forEach((t) => ul.append(el("li", t))); return ul; };
[["핵심 내용", r.summary], ["시험에 나올 만한 것", r.exam_points], ["헷갈리기 쉬운 것", r.pitfalls], ["이렇게 공부해", r.study_tips]]
  .forEach(([title, items], i) => { if (items.length) section(title, list(items), i * 2); });
if (r.concepts.length) {
  const table = el("table");
  r.concepts.forEach((c) => { const tr = el("tr"); tr.append(el("th", c.term), el("td", c.why)); table.append(tr); });
  section("꼭 알아야 할 개념", table, 1);
}
document.getElementById("print").onclick = () => print();
</script>
</body>
</html>
